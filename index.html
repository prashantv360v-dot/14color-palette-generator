
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Generate random HEX color palettes and copy colors with one click.">
    <title>Color Palette Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <header class="header">
            <div class="logo">Color<span>Craft</span></div>
            <p class="subtitle">Find the perfect colors for your next project.</p>
        </header>

        <section class="palette-section">
            <div class="section-heading">
                <div>
                    <h1>Color Palette Generator</h1>
                    <p>Click any color to copy its HEX code.</p>
                </div>
                <span class="palette-count">7 COLORS</span>
            </div>

            <div class="palette-grid" id="paletteGrid">
                <!-- Color swatches are generated by JavaScript -->
            </div>

            <div class="actions">
                <button class="generate-btn" id="generateBtn">
                    <span class="refresh-icon">↻</span>
                    Generate New Palette
                </button>
                <p class="shortcut">Press <kbd>Space</kbd> to generate a new palette</p>
            </div>

            <div class="toast" id="toast" role="status" aria-live="polite"></div>
        </section>

        <footer>
            <p>Made with <span class="heart">Prashant♥</span> for creative minds</p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
